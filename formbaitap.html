
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập tạo form đơn giản</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px 15px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .form-box {
            background-color: white;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #cccccc;
        }

        h2 {
            text-align: center;
            color: #1976d2;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label, .label-title {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea {
            height: 85px;
            resize: vertical;
        }

        .options label {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 8px;
            font-weight: normal;
        }

        .buttons {
            margin-top: 20px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 8px;
        }

        input[type="submit"] {
            background-color: #1976d2;
            color: white;
        }

        input[type="submit"]:hover {
            background-color: #125aa0;
        }

        input[type="reset"] {
            background-color: #e0e0e0;
            color: #333;
        }

        .required {
            color: red;
        }
    </style>
</head>

<body>
<div class="container">

    <!-- PHẦN 1 -->
    <div class="form-box">
        <h2>Phần 1: Form thông tin cá nhân</h2>

        <form action="#" method="get">
            <div class="form-group">
                <label for="yourname">
                    Họ và tên <span class="required">*</span>
                </label>
                <input type="text" id="yourname"
                       name="yourname"
                       placeholder="Nhập họ và tên" required>
            </div>

            <div class="form-group">
                <label for="email1">
                    Email <span class="required">*</span>
                </label>
                <input type="email" id="email1"
                       name="email"
                       placeholder="Nhập email" required>
            </div>

            <div class="form-group">
                <span class="label-title">Sở thích</span>
                <div class="options">
                    <label>
                        <input type="checkbox" name="hobby" value="music">
                        Âm nhạc
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="sports">
                        Thể thao
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="travel">
                        Du lịch
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="reading">
                        Đọc sách
                    </label>
                </div>
            </div>

            <div class="buttons">
                <input type="submit" value="Gửi thông tin">
                <input type="reset" value="Nhập lại">
            </div>
        </form>
    </div>

    <!-- PHẦN 2 -->
    <div class="form-box">
        <h2>Phần 2: Form đăng ký học viên</h2>

        <form action="#" method="get">
            <div class="form-group">
                <label for="fullname">
                    Họ và tên <span class="required">*</span>
                </label>
                <input type="text" id="fullname"
                       name="fullname"
                       placeholder="Nhập họ và tên" required>
            </div>

            <div class="form-group">
                <label for="email2">Email</label>
                <input type="email" id="email2"
                       name="email"
                       placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone"
                       name="phone"
                       placeholder="Nhập số điện thoại">
            </div>

            <div class="form-group">
                <label for="birthday">Ngày sinh</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-group">
                <span class="label-title">Giới tính</span>
                <div class="options">
                    <label>
                        <input type="radio" name="gender" value="Nam">
                        Nam
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Nữ">
                        Nữ
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Khác">
                        Khác
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ</label>
                <textarea id="address" name="address"
                          placeholder="Nhập địa chỉ"></textarea>
            </div>

            <div class="form-group">
                <label for="course">Khóa học</label>
                <select id="course" name="course">
                    <option value="">-- Chọn khóa học --</option>
                    <option value="HTML & CSS">HTML &amp; CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                </select>
            </div>

            <div class="form-group">
                <span class="label-title">Hình thức học</span>
                <div class="options">
                    <label>
                        <input type="radio" name="study_type" value="Online">
                        Online
                    </label>

                    <label>
                        <input type="radio" name="study_type" value="Offline">
                        Offline
                    </label>
                </div>
            </div>

            <div class="form-group">
                <span class="label-title">Sở thích</span>
                <div class="options">
                    <label>
                        <input type="checkbox" name="hobby" value="music">
                        Âm nhạc
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="sports">
                        Thể thao
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="technology">
                        Công nghệ
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="reading">
                        Đọc sách
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="note">Ghi chú</label>
                <textarea id="note" name="note"
                          placeholder="Nhập ghi chú nếu có"></textarea>
            </div>

            <div class="buttons">
                <input type="submit" value="Đăng ký">
                <input type="reset" value="Nhập lại">
            </div>
        </form>
    </div>

</div>
</body>
</html>
